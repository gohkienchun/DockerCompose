version: '3.8'
# master localhost:23306, slave localhost:23307, root password: password
services:
  masterdb:
    image: mysql:8.4
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      REPL_USER: repl
      REPL_PASSWORD: replpass
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - "./master/init:/docker-entrypoint-initdb.d:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -Nse "SELECT COUNT(*) FROM mysql.user WHERE user=''$$REPL_USER''" | grep -qx 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  slavedb:
    image: mysql:8.4
    ports:
      - "23307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      MASTER_HOST: masterdb
      MASTER_PORT: "3306"
      REPL_USER: repl
      REPL_PASSWORD: replpass
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --relay-log=relay-bin
    depends_on:
      masterdb:
        condition: service_healthy
    volumes:
      - "./slave/init:/docker-entrypoint-initdb.d:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SHOW REPLICA STATUS\G" | awk ''/Replica_IO_Running: Yes/{io=1} /Replica_SQL_Running: Yes/{sql=1} END{exit !(io && sql)}'''
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
